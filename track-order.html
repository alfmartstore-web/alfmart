<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - AlfMart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        canvas: 'var(--color-canvas)',
                        ink: 'var(--color-ink)',
                        paper: 'var(--color-paper)',
                        leather: 'var(--color-leather)',
                        whiskey: 'var(--color-whiskey)',
                        gold: 'var(--color-gold)',
                    },
                    fontFamily: {
                        serif: ['"Crimson Text"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <script>
        // Initialize theme from localStorage with proper key name (consistent with other pages)
        const savedTheme = localStorage.getItem('alfmart-theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --color-canvas: #F4F4F4;
            --color-ink: #1A1A1A;
            --color-paper: #FFFFFF;
            --color-leather: #4A2C2A;
            --color-gold: #D4AF37;
            --color-whiskey: #8B5A2B;
        }
        .dark {
            --color-canvas: #0F0F0F;
            --color-ink: #E5E5E5;
            --color-paper: #111111;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--color-canvas); color: var(--color-ink); transition: background-color 0.5s ease, color 0.5s ease; }
        .font-serif { font-family: 'Crimson Text', serif; }
    </style>
</head>
<body class="bg-canvas text-ink" id="app">
    <!-- Header -->
    <header class="fixed top-0 w-full z-30 px-6 py-6 transition-all duration-300 bg-canvas dark:bg-dark-canvas border border-gray-200 dark:border-gray-800" :class="{'py-4 shadow-sm': scrolled, 'py-8': !scrolled}">
        <div class="max-w-[1600px] mx-auto flex justify-between items-center">
            <button @click="mobileMenuOpen = true" class="md:hidden" :class="isDark ? 'text-white' : 'text-ink'">
                <i class="ph ph-list text-2xl"></i>
            </button>

            <!-- Desktop Nav -->
            <nav class="hidden md:flex gap-8 font-sans text-xs tracking-[0.2em] uppercase font-medium" :class="isDark ? 'text-white' : 'text-ink'">
                <a href="products.html" class="hover:text-leather transition-colors">Shop</a>
                <a href="about.html" class="hover:text-leather transition-colors">About</a>
                <a href="contact.html" class="hover:text-leather transition-colors">Contact</a>
                <a href="track-order.html" class="hover:text-leather transition-colors">Track Order</a>
                <a href="returns.html" class="hover:text-leather transition-colors">Returns</a>
            </nav>

            <!-- Logo -->
            <div class="absolute left-1/2 transform -translate-x-1/2 text-center">
                <h1 class="font-serif text-2xl md:text-3xl font-bold tracking-tight cursor-pointer text-transparent bg-clip-text bg-gradient-to-r via-gold to-whiskey" :class="isDark ? 'from-white' : 'from-ink'" @click="goHome">ALFMART</h1>
            </div>

            <!-- Icons -->
            <div class="flex items-center gap-6">
                <button @click="toggleTheme" class="hidden md:block hover:text-gold transition-colors" :class="isDark ? 'text-white' : 'text-ink'">
                    <i :class="isDark ? 'ph-sun' : 'ph-moon'" class="ph text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <div v-show="isDark" class="fixed inset-0 pointer-events-none opacity-40 mix-blend-overlay bg-grain z-20 h-full w-full"></div>

    <!-- Main Content -->
    <main class="pt-32 pb-24 px-6 md:px-20 min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full">
            <div class="text-center mb-12">
                <p class="font-sans text-xs text-gold font-bold tracking-[0.2em] uppercase mb-4">Status Update</p>
                <h1 class="font-serif text-4xl md:text-5xl mb-6">Track Order</h1>
                <p class="font-sans text-sm text-gray-500 dark:text-gray-400">Enter your order ID to see the current status of your shipment.</p>
            </div>

            <div class="bg-paper p-8 shadow-lg border border-gray-100 dark:border-gray-800">
                <div class="space-y-6">
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest mb-2 text-gray-500">Order ID</label>
                        <input type="text" class="w-full bg-transparent border-b border-gray-300 dark:border-gray-700 py-2 focus:border-gold outline-none transition-colors text-ink placeholder-gray-400" placeholder="e.g. AM123456">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest mb-2 text-gray-500">Email Address</label>
                        <input type="email" class="w-full bg-transparent border-b border-gray-300 dark:border-gray-700 py-2 focus:border-gold outline-none transition-colors text-ink placeholder-gray-400" placeholder="you@example.com">
                    </div>
                    <button class="w-full bg-ink dark:bg-white text-white dark:text-black py-4 font-sans text-xs font-bold tracking-[0.2em] uppercase hover:bg-leather transition-colors mt-4">
                        Track
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-ink dark:bg-[#0a0a0a] text-[#E5E5E5] pt-24 pb-10 px-6 md:px-20 border-t border-gold/10">
        <div class="max-w-[1600px] mx-auto grid grid-cols-1 md:grid-cols-4 gap-16 mb-20">
            <div class="col-span-1 md:col-span-1">
                <h2 class="font-serif text-3xl mb-6 text-gold">ALFMART</h2>
                <p class="font-sans text-sm text-white/60 leading-relaxed mb-6">Your trusted destination for premium products.</p>
            </div>
            <div class="col-span-1">
                <h4 class="font-sans text-xs font-bold tracking-[0.2em] uppercase mb-8 text-white">Service</h4>
                <ul class="space-y-4 font-sans text-sm text-white/60">
                    <li><a href="track-order.html" class="hover:text-gold transition-colors">Track Order</a></li>
                    <li><a href="returns.html" class="hover:text-gold transition-colors">Returns & Exchange</a></li>
                    <li><a href="contact.html" class="hover:text-gold transition-colors">Contact Us</a></li>
                </ul>
            </div>
        </div>
        <div class="border-t border-white/10 pt-10 flex flex-col md:flex-row justify-between items-center text-xs font-sans text-white/40 tracking-wide">
            <p>&copy; 2026 AlfMart. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const isDark = ref(document.documentElement.classList.contains('dark'));

                const toggleTheme = () => {
                    isDark.value = !isDark.value;
                    localStorage.setItem('theme', isDark.value ? 'dark' : 'light');
                    if (isDark.value) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                };

                const goHome = () => {
                    window.location.href = 'index.html';
                };

                onMounted(() => {
                });

                return { isDark, toggleTheme, goHome };
            }
        }).mount('#app');
    </script>
</body>
</html>
